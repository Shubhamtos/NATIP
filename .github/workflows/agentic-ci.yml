name: Agentic CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/natip-agentic-core]

jobs:
  test-agentic-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run agentic tests
        run: |
          pytest -q tests/test_agentic_core.py tests/test_api_main.py
