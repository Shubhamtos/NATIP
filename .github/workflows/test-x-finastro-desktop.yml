name: Test X FinAstro Desktop

on:
  push:
    branches:
      - feature/x-finastro-desktop-scraper
    paths:
      - "x_finastro_desktop/**"
      - ".github/workflows/test-x-finastro-desktop.yml"
  pull_request:
    paths:
      - "x_finastro_desktop/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x_finastro_desktop

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile app.py scraper.py finastro.py
      - name: Smoke-test classifier
        run: |
          python - <<'PY'
          from finastro import classify
          result = classify("Saturn transit may make Nifty bearish. #finastro")
          assert result["is_finastro"]
          assert "saturn" in result["astro_terms"]
          assert "nifty" in result["market_terms"]
          assert result["direction"] == "Bearish"
          print(result)
          PY
