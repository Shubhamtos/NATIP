[server]
headless = true
# The bundled Python runtime is inside this project. Never hot-reload its
# enum/typing modules while third-party libraries retain references to them.
fileWatcherType = "none"
runOnSave = false
folderWatchBlacklist = ["**/python-standalone", "**/venv", "**/.venv", "**/data", "**/models", "**/outputs", "**/reports", "**/logs"]
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#00B386"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7FAF9"
textColor = "#172B2B"
