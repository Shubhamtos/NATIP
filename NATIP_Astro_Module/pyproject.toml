[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "natip-astro"
version = "0.1.0"
description = "Research-only astrology feature and event-calendar add-on for NATIP"
requires-python = ">=3.11"
dependencies = [
  "skyfield>=1.53,<2",
  "skyfield-data>=7,<8",
]

[project.scripts]
natip-astro = "natip_astro.cli:main"

[tool.setuptools.packages.find]
include = ["natip_astro*"]

