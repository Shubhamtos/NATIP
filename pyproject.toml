[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "NATIP"
version = "0.1.0"
description = "NSE Agentic Trading Intelligence Platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "NATIP Contributors" }
]
dependencies = [
  "fastapi>=0.111.0",
  "streamlit>=1.36.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "openpyxl>=3.1.0",
  "yfinance>=1.5.2",
  "plotly>=6.9.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=5.0.0",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",
  "joblib>=1.4.0",
  "shap>=0.46.0",
  "lightgbm>=4.7.0",
  "skyfield>=1.49.0",
  "torch>=2.0.0",
  "huggingface-hub>=0.33.1",
  "safetensors>=0.6.2",
  "einops>=0.8.1",
  "tqdm>=4.67.1",
]

[project.scripts]
backtest = "app.backtesting.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.5.0",
  "black>=24.4.0",
  "mypy>=1.10.0",
  "httpx2>=2.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/vendor/kronos", "app/vendor/tradingagents_research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
