services:
  - type: web
    name: natip-agentic
    runtime: python
    branch: feature/natip-agentic-core
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/dashboard/pages/Agentic_Assistant.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: NATIP_GEMINI_API_KEY
        sync: false
      - key: NATIP_GEMINI_MODEL
        value: gemini-2.5-flash
